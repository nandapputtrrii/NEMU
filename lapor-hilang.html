<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEMU - Lapor Barang Hilang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-sm">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 md:px-8">
        <a href="nemu.html" class="text-xl font-bold text-violet-600">NEMU</a>

        <nav>
          <ul class="flex items-center gap-5 text-sm font-semibold md:gap-8 md:text-base">
            <li>
              <a href="nemu.html" class="relative inline-block text-slate-700 transition-all duration-200 hover:text-violet-600 after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-full after:origin-left after:scale-x-0 after:bg-violet-600 after:transition-transform after:duration-300 hover:after:scale-x-100">Beranda</a>
            </li>
            <li>
              <a href="lapor-hilang.html" class="relative inline-block text-violet-600 after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-full after:origin-left after:scale-x-100 after:bg-violet-600">Lapor Barang</a>
            </li>
            <li>
              <a href="nemu.html#cari" class="relative inline-block text-slate-700 transition-all duration-200 hover:text-violet-600 after:absolute after:-bottom-1 after:left-0 after:h-0.5 after:w-full after:origin-left after:scale-x-0 after:bg-violet-600 after:transition-transform after:duration-300 hover:after:scale-x-100">Cari Barang</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-10 md:px-8">
      <section class="mb-8 rounded-3xl bg-gradient-to-r from-violet-600 to-indigo-600 p-8 text-white shadow-lg">
        <p class="mb-2 text-sm uppercase tracking-[0.2em] text-violet-100">NEMU UMM</p>
        <h1 class="text-3xl font-bold md:text-4xl">Lapor Barang Hilang</h1>
        <p class="mt-3 max-w-2xl text-violet-100">
          Isi formulir di bawah ini agar barang yang hilang dapat dilihat oleh mahasiswa lain dan lebih mudah ditemukan kembali.
        </p>
      </section>

      <section class="rounded-3xl bg-white p-6 shadow-md md:p-8">
        <form class="grid gap-6 md:grid-cols-2">
          <div class="md:col-span-2">
            <label for="nama" class="mb-2 block text-sm font-semibold text-slate-700">Nama Pelapor</label>
            <input id="nama" type="text" placeholder="Contoh: Nanda Putri" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
            <input id="email" type="email" placeholder="namamu@student.umm.ac.id" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="telepon" class="mb-2 block text-sm font-semibold text-slate-700">Nomor Telepon</label>
            <input id="telepon" type="tel" placeholder="08xxxxxxxxxx" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="barang" class="mb-2 block text-sm font-semibold text-slate-700">Nama Barang</label>
            <input id="barang" type="text" placeholder="Contoh: KTM, helm, tas, dompet" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="kategori" class="mb-2 block text-sm font-semibold text-slate-700">Kategori</label>
            <select id="kategori" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200">
              <option value="">Pilih kategori</option>
              <option value="elektronik">Elektronik</option>
              <option value="dokumen">Dokumen</option>
              <option value="aksesoris">Aksesoris</option>
              <option value="pakaian">Pakaian</option>
              <option value="lainnya">Lainnya</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label for="lokasi" class="mb-2 block text-sm font-semibold text-slate-700">Lokasi Terakhir Diketahui</label>
            <input id="lokasi" type="text" placeholder="Contoh: Perpustakaan Pusat, GKB 1, Gedung E" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="tanggal" class="mb-2 block text-sm font-semibold text-slate-700">Tanggal Kehilangan</label>
            <input id="tanggal" type="date" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div>
            <label for="jam" class="mb-2 block text-sm font-semibold text-slate-700">Jam Kehilangan</label>
            <input id="jam" type="time" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200" />
          </div>

          <div class="md:col-span-2">
            <label for="deskripsi" class="mb-2 block text-sm font-semibold text-slate-700">Deskripsi Barang</label>
            <textarea id="deskripsi" rows="5" placeholder="Jelaskan ciri-ciri barang, warna, merek, dan detail penting lainnya..." class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-200"></textarea>
          </div>

          <div class="md:col-span-2 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <button type="submit" class="rounded-xl bg-violet-600 px-6 py-3 font-semibold text-white shadow-md transition hover:bg-violet-700 hover:shadow-lg active:scale-95">
              Kirim Laporan
            </button>

            <a href="nemu.html" class="inline-flex items-center justify-center rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-700 transition hover:border-violet-500 hover:text-violet-600">
              Kembali ke Beranda
            </a>
          </div>
        </form>
      </section>
    </main>

    <footer class="mt-12 bg-slate-900 py-6 text-center text-sm text-slate-300">
      &copy; 2026 NEMU. Lost & Found Mahasiswa UMM.
    </footer>
  </body>
</html>
